# Config pipeline — Taverne niveau 1 (rudimentaire). Consommé par
# scripts/building-pipeline.py. Empreinte : 2 tuiles de large (2×1).
# v2 (2026-08-16) : direction artistique Monkey Island réécrite — bâtiment
# LONG et BAS pour remplir l'empreinte 2:1 (la v1 quasi carrée débordait).

id: tavern
name: Taverne "Le Rat Qui Louche"
anchor: ground                    # posée au sol (plage)
tile_width: 2                     # empreinte grille : 2 tuiles de large
tile_height: 1
facing_direction: south           # la façade / le comptoir regarde le SUD (−X),
                                  # c.-à-d. vers la caméra (comme la passerelle du port)
target_polycount: 3000
variations: 1

# Description visuelle pour SpriteCook — style Monkey Island : bar de plage
# rudimentaire, loufoque, truffé de détails pirates. Le bâtiment doit être
# nettement plus LARGE que profond (~2:1) pour remplir l'empreinte 2×1.
sprite_description: >-
  Wide ramshackle beach-bar tavern, level 1, in the cartoon style of classic
  Monkey Island games, full of goofy pirate humor: a LONG low shack (twice as
  wide as it is deep) built from weathered driftwood planks and salvaged ship
  parts, a wide open front counter facing the viewer, sagging thatched
  palm-leaf roof, a crooked hanging wooden sign painted with a skull and
  crossed cutlasses, rum barrels stacked beside the counter, coiled ropes and
  a fishing net draped on a post, a green parrot perched on the roof edge,
  two tiki torches, a tiny chalkboard menu with a doodled fish, a half-buried
  anchor in the sand, warm late-afternoon Caribbean sunlight, saturated
  palette, chunky 16-bit pixel art with bold dark outlines and dithering.
  The building spans the full width of the canvas, single centered asset.

art_direction:
  style: hand-drawn pixel art
  theme: monkey island pirate comedy caribbean beach
  style_label: 16-bit SNES style

meshy_texture_prompt: >-
  weathered driftwood planks, salvaged ship wood, thatched palm roof, skull
  sign, rum barrels, warm sunset light, toon shading, monkey island cartoon
  style

style_reference_asset_id: null
