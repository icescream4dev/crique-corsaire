<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crique Corsaire</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }
      #game-container { width: 100%; height: 100%; }
      #game-container canvas { image-rendering: pixelated; display: block; }
      #hud { position: fixed; top: 8px; left: 8px; z-index: 20; color: rgba(255,255,255,0.7); font-size: 13px; pointer-events: none; }
      /* Boussole HUD : positions écran des cardinaux (caméra NE regardant SO) */
      #compass { position: fixed; left: 16px; bottom: 16px; z-index: 20; width: 90px; height: 90px; pointer-events: none; font-family: monospace; }
      #compass div { position: absolute; font-size: 13px; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000; }
      .c-n { top: 0; right: 0; color: #ff5555 !important; }   /* Nord  = +X = bas-droite écran */
      .c-s { top: 0; left: 0; color: #5599ff !important; }    /* Sud   = -X = haut-gauche */
      .c-e { bottom: 0; left: 0; color: #55ff55 !important; } /* Est   = +Z = bas-gauche */
      .c-w { bottom: 0; right: 0; color: #ffff55 !important; }/* Ouest = -Z = haut-droite */
      .c-legend { left: 0; top: 50%; width: 90px; text-align: center; font-size: 9px; transform: translateY(-50%); color: rgba(255,255,255,0.6); }
      #toolbar { position: fixed; top: 8px; right: 8px; z-index: 20; display: flex; gap: 6px; }
      #toolbar button, #toolbar a { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; text-decoration: none; font-family: monospace; }
      #toolbar button:active { background: rgba(255,255,255,0.3); }
    </style>
  </head>
  <body>
    <div id="hud">🏴‍☠️ Crique Corsaire</div>
    <div id="compass">
      <div class="c-n">N</div><div class="c-w">O</div><div class="c-e">E</div><div class="c-s">S</div>
      <div class="c-legend">N=+X · S=−X · E=+Z · O=−Z</div>
    </div>
    <div id="toolbar">
      <button id="btn-regenerate">🔄 Nouvelle île</button>
      <button id="btn-port">⚓ Port</button>
      <button id="btn-hideout">🏴‍☠️ Repaire</button>
      <a href="/batiments.html">🏗️ Bâtiments</a>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
