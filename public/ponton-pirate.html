<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponton Pirate — Crique Corsaire</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0a1628; display:flex; align-items:center; justify-content:center; height:100vh; }
  canvas { image-rendering:pixelated; border-radius:4px; box-shadow:0 0 40px rgba(0,0,0,.5); }
</style>
</head>
<body>
<script>
const W=160, H=128, S=3; // canvas at 3x scale = 480x384 display

function setup(){ createCanvas(W*S,H*S); noSmooth(); pixelDensity(1); noiseSeed(42); }

function draw(){
  background(0x0a,0x16,0x28);
  scale(S);
  
  const t=frameCount*0.02;
  const cx=W/2, cy=H/2+8;

  // === EAU ===
  noStroke();
  for(let y=cy-4;y<H;y+=1){
    const wave=sin(y*0.3+t*1.8)*2.5 + sin(y*0.15+t*.9)*4 + sin(y*0.08+t*.4)*6;
    for(let x=0;x<W;x++){
      const wx=x+wave+sin(x*0.1+t)*2;
      const d=dist(wx,y,cx,cy+10);
      let b=map(y,cy,H,180,40);
      fill(26+sin(x*0.05+y*0.04+t)*8, 82+sin(x*0.07+t*1.2)*12, 118+b*0.3,220);
      rect(x,y,1,1);
    }
  }

  // === REFLET ===
  for(let y=cy-4;y<H;y++){
    for(let x=W*.15;x<W*.85;x++){
      const d=abs(y-(cy+sin(x*0.06+t)*3));
      if(d<12){ fill(41,128,185,map(d,0,12,40,0)); rect(x,y,1,1); }
    }
  }

  // === PONTOON ===
  const px=cx-24, py=cy-8;
  // Piliers (4x)
  for(let i=0;i<4;i++){
    const ix=px+5+i*15;
    // Bois immergé
    fill(30+sin(i)*10,25+cos(i*2)*8,12); rect(ix,py+16,4,20);
    fill(50+sin(i*3)*10,35+cos(i)*8,20); rect(ix+1,py+16,2,20);
    // Bois au-dessus de l'eau
    fill(70,45,18); rect(ix,py,4,16);
    fill(85,55,25); rect(ix+1,py,2,16);
    fill(60,38,12); rect(ix,py+8,4,1);
    fill(60,38,12); rect(ix,py+4,4,1);
    // Anneau rouillé
    fill(80,45,10); rect(ix-1,py+12,6,1);
    fill(100,55,12); rect(ix,py+12,4,1);
  }

  // Planches (5 traverses)
  for(let i=0;i<5;i++){
    const iy=py+2+i*3;
    fill(100,65,20); rect(px-2,iy,54,2);
    fill(110,75,30); rect(px+4,iy,10,2);
    fill(90,55,15); rect(px+30,iy,8,2);
    // Clous
    fill(60,55,55); rect(px+4,iy,1,2);
    fill(60,55,55); rect(px+20,iy,1,2);
    fill(60,55,55); rect(px+38,iy,1,2);
    fill(60,55,55); rect(px+48,iy,1,2);
  }
  // Planche bancale
  fill(95,58,18); rect(px+8,py-2,12,2);
  fill(55,38,10); rect(px+14,py-2,6,1);
  // Corde qui pend
  stroke(140,110,60); strokeWeight(1); noFill();
  const ropeX=px+2+sin(t*.7)*.5;
  line(ropeX,py+15, ropeX+cos(t*.5)*.3, py+22);

  // === MÂT ===
  fill(60,38,18);
  const mastX=cx+8, mastTop=py-28;
  rect(mastX, mastTop, 3, py-mastTop+15);
  fill(75,48,25);
  rect(mastX+1, mastTop, 1.5, py-mastTop+15);

  // === DRAPEAU PIRATE (animé) ===
  const flagX=mastX+3, flagY=mastTop+2;
  const wave=sin(t*2.5)*3 + sin(t*5.3)*1.5;
  noStroke();
  // Pavillon noir
  fill(15,15,15);
  beginShape();
  vertex(flagX, flagY);
  for(let i=0;i<=14;i++){
    const fy=flagY+i;
    const fx=flagX + sin(fy*0.4+t*2.5)*4 + sin(fy*0.8+t*5)*2;
    vertex(fx, fy);
  }
  vertex(flagX-2, flagY+14);
  endShape(CLOSE);
  
  // Bordure déchirée
  fill(8,8,8);
  for(let i=0;i<=14;i+=2){
    const fy=flagY+i;
    const fx=flagX-1 + sin(fy*0.5+t*2.7)*5;
    rect(fx, fy, 1, 2);
  }

  // Crâne
  fill(220,215,200);
  rect(flagX+4, flagY+2, 4,3);
  rect(flagX+3, flagY+3, 1,1);
  rect(flagX+8, flagY+3, 1,1);
  // Yeux
  fill(10,10,10);
  rect(flagX+5, flagY+3, 1,1);
  rect(flagX+7, flagY+3, 1,1);
  // Mâchoire
  fill(220,215,200);
  rect(flagX+5, flagY+6, 4,1);
  // Tibias
  fill(200,195,180);
  rect(flagX+3, flagY+8, 6,1);
  rect(flagX+4, flagY+8, 1,2);
  rect(flagX+7, flagY+8, 1,2);

  // === LANTERNE ===
  const lx=mastX-5, ly=py-6;
  fill(180,130,15); rect(lx,ly,4,4); // corps
  fill(220,170,30); rect(lx+1,ly+1,2,2); // lueur
  fill(80,40,5); rect(lx,ly-2,4,2); // capot
  fill(60,30,5); rect(lx+1,ly-3,1,2); // crochet
  
  // Lueur ambiante
  for(let r=3;r<8;r++){
    const a=map(r,3,8,60,0);
    fill(255,200,60,a);
    rect(lx+1-r,ly+1-r,r*2+2,r*2+2);
  }

  // === DÉTAILS : caisses, tonneau ===
  fill(80,45,20); rect(px+38,py-5,6,6); // caisse
  fill(90,55,25); rect(px+39,py-4,4,1);
  fill(60,55,50); rect(px+38,py-5,1,1); // clou
  fill(60,55,50); rect(px+43,py-5,1,1);
  
  fill(120,70,25); rect(px+22,py-3,5,6); // tonneau
  fill(105,55,15); rect(px+23,py-2,3,1);
  fill(105,55,15); rect(px+23,py+2,3,1);

  // Éclaboussures
  for(let i=0;i<3;i++){
    const sx=px+10+i*20+sin(t*2+i)*3;
    const sy=py+17+sin(t*1.5+i)*2;
    fill(41,128,185,30+sin(t*3+i)*10);
    rect(sx,sy,1+sin(t+i)*1,1+sin(t*2+i)*1);
  }
}
</script>
</body>
</html>
